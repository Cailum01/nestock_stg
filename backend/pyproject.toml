[project]
name = "nestock-backend"
version = "0.1.0"
description = "Nestock skeleton: API and shared domain boundaries"
requires-python = ">=3.12"
dependencies = [
    "azure-cosmos>=4.9,<5",
    "azure-identity>=1.19,<2",
    "azure-storage-blob>=12.20,<13",
    "fastapi>=0.115,<1",
    "google-cloud-firestore>=2.34,<3",
    "google-genai>=1.55,<2",
    "google-cloud-storage>=3.17,<4",
    "httpx>=0.28,<1",
    "langchain-openai>=1.7,<2",
    "langchain-google-genai>=4,<5",
    "langgraph>=1.2,<2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.2,<2",
    "python-multipart>=0.0.18",
    "uvicorn>=0.34,<1",
    "opencc-python-reimplemented>=0.1.7,<0.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
speech-e2e = ["edge-tts>=6.1.0", "imageio-ffmpeg>=0.5.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:langsmith_plugin -m 'not speech_e2e and not live_eval'"
markers = [
    "speech_e2e: End-to-end speech tests requiring external network or live cloud credentials",
    "live_eval: explicitly enabled Azure OpenAI tool-selection evaluation",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
