name: nestock
description: Nestock｜窩有 — scene-based household inventory skeleton.
publish_to: none
version: 1.0.1+2
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  image: ^4.12.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  record: ^7.1.2
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/objects/
    - assets/images/agent/
    - assets/images/room/
    - assets/images/weather/
    - assets/images/ui/
