[project]
name = "nestock-backend"
version = "0.1.0"
description = "Nestock skeleton: API and shared domain boundaries"
requires-python = ">=3.12"
dependencies = [
    "azure-cosmos>=4.9,<5",
    "azure-identity>=1.19,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.2,<2",
    "python-multipart>=0.0.18",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "edge-tts>=6.1.0", "imageio-ffmpeg>=0.5.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
